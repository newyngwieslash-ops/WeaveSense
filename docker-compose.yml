services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
      POSTGRES_DB: loom
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-loom}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-loom-secret-change-me}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 8s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-loom}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-loom-secret-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-loom}
    restart: on-failure
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 4
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p "local/$$MINIO_BUCKET" || true
        mc anonymous set download "local/$$MINIO_BUCKET" || true


  telethon:
    build:
      context: ./workers/telethon
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION: ${TELEGRAM_SESSION:-}
      TELEGRAM_SESSION_PATH: /data/loom.session
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-loom}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-loom-secret-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-loom}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://127.0.0.1:9000/loom}
      TELETHON_CONCURRENCY: ${TELETHON_CONCURRENCY:-3}
      PORT: "8787"
    volumes:
      - telethon-session:/data
    depends_on:
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  wechat-gateway:
    build: .
    command: ["npm", "run", "gateway:start"]
    environment:
      WECHAT_GATEWAY_TOKEN: ${WECHAT_GATEWAY_TOKEN:-change-me}
      WECHAT_PRIMARY_ALLOWED_HOSTS: ${WECHAT_PRIMARY_ALLOWED_HOSTS:-wechat-fixture}
      GATEWAY_DB_PATH: /data/wechat-gateway.sqlite
      PORT: "8790"
    volumes:
      - wechat-gateway-data:/data
    restart: unless-stopped

  wechat-fixture:
    profiles: ["qa"]
    build: .
    command: ["node", "workers/wechat-gateway/fixture-server.mjs"]

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://loom:loom@postgres:5432/loom
      TELEGRAM_WORKER_URL: http://telethon:8787
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-loom}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-loom-secret-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-loom}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://127.0.0.1:9000/loom}
      XAI_API_KEY: ${XAI_API_KEY:-}
      TICK_LIMIT: ${TICK_LIMIT:-20}
      EXTRACT_AUTO: ${EXTRACT_AUTO:-false}
      WECHAT_GATEWAY_URL: http://wechat-gateway:8790
      WECHAT_GATEWAY_TOKEN: ${WECHAT_GATEWAY_TOKEN:-change-me}
      VITE_AUTH_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      telethon:
        condition: service_started
      minio:
        condition: service_started
      wechat-gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  telethon-session:
  wechat-gateway-data:
