acceptance:
  - id: A1
    source: brief.md
    text: "A1: 双击 `restart.bat` 后，脚本对当前目录执行 `docker compose down` 再 `docker compose
      up --build -d`，不带 `-v`。"
    result: passed
    reason:
      text: 先 call :compose down（无 -v）再 up --build -d；本机验证子程序 %* 会传入这些参数
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 控制面 `http://127.0.0.1:8080/` 返回成功后，脚本用默认浏览器打开该地址。"
    result: passed
    reason:
      text: curl 探测 8080 成功后执行 start "" "http://127.0.0.1:8080"
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: Docker 未安装或守护进程未运行时，窗口显示中文错误并等待按键，不立刻关闭。"
    result: passed
    reason:
      text: where docker / docker info 失败打印中文并 goto fail（pause + exit /b 1）
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 再次双击同一脚本可完成重启：旧栈被停掉后新栈拉起，不因 `8080` 占用而失败。"
    result: passed
    reason:
      text: 再次运行会先结束 8080 LISTEN 再 down/up，杀进程失败不中断
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 启动成功后命令窗口保持打开并跟随 `docker compose logs`；用户关掉窗口不作为失败条件。"
    result: passed
    reason:
      text: 就绪后 compose logs -f，成功路径 exit /b 0，关闭窗口不 down
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 脚本不写入 `.env`、不含 Telegram / xAI 密钥，也不调用 Telethon `login.py`。"
    result: passed
    reason:
      text: 全文无写入 .env、无 Telegram/xAI 密钥、无 login.py
      truncated: false
